{% extends "base.html" %}
{% block title %}发布活动 - 校园活动管理系统{% endblock %}

{% block content %}
<div class="form-card">
    <h2>发布新活动</h2>

    {% if errors %}
        <div class="alert alert-danger">
            {% for error in errors %}
                <p>{{ error }}</p>
            {% endfor %}
        </div>
    {% endif %}

    <form action="{{ url_for('activity.new_activity') }}" method="POST" id="newActivityForm">
        <div class="form-group form-full">
            <label for="title">活动标题</label>
            <input type="text" id="title" name="title" required
                   placeholder="请输入活动标题"
                   value="{{ form.title if form and form.title else '' }}">
        </div>

        <div class="form-group form-full">
            <label for="description">活动简介</label>
            <textarea id="description" name="description" rows="5"
                      placeholder="请输入活动简介">{{ form.description if form and form.description else '' }}</textarea>
        </div>

        <div class="form-group form-full">
            <label for="location">活动地点</label>
            <input type="text" id="location" name="location" required
                   placeholder="请输入活动地点"
                   value="{{ form.location if form and form.location else '' }}">
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="start_time">开始时间</label>
                <input type="datetime-local" id="start_time" name="start_time" required
                       value="{{ form.start_time if form and form.start_time else '' }}">
            </div>
            <div class="form-group">
                <label for="end_time">结束时间</label>
                <input type="datetime-local" id="end_time" name="end_time" required
                       value="{{ form.end_time if form and form.end_time else '' }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="capacity">名额上限</label>
                <input type="number" id="capacity" name="capacity" min="1" required
                       placeholder="请输入名额上限"
                       value="{{ form.capacity if form and form.capacity else '' }}">
            </div>
            <div class="form-group">
                <label for="register_deadline">报名截止时间</label>
                <input type="datetime-local" id="register_deadline" name="register_deadline" required
                       value="{{ form.register_deadline if form and form.register_deadline else '' }}">
            </div>
        </div>

        <div class="form-row">
            <div class="form-group">
                <label for="eligibility">资格条件（可选）</label>
                <input type="text" id="eligibility" name="eligibility"
                       placeholder="如：限计算机学院大二以上"
                       value="{{ form.eligibility if form and form.eligibility else '' }}">
            </div>
            <div class="form-group">
                <label for="require_review">
                    <input type="checkbox" id="require_review" name="require_review"
                           {% if form and form.get('require_review') %}checked{% endif %}>
                    需要审核（学生报名后需教师审核通过才占用名额）
                </label>
            </div>
        </div>

        <div class="form-actions">
            <button type="submit" class="btn btn-primary">发布活动</button>
            <a href="{{ url_for('teacher.my_activities') }}" class="btn btn-secondary">取消</a>
        </div>
    </form>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('newActivityForm').addEventListener('submit', function (e) {
    var title = document.getElementById('title').value.trim();
    var location = document.getElementById('location').value.trim();
    var start = document.getElementById('start_time').value;
    var end = document.getElementById('end_time').value;
    var capacity = document.getElementById('capacity').value;
    var deadline = document.getElementById('register_deadline').value;

    if (!title) { alert('活动标题不能为空'); e.preventDefault(); return; }
    if (!location) { alert('活动地点不能为空'); e.preventDefault(); return; }
    if (!start || !end) { alert('请填写活动起止时间'); e.preventDefault(); return; }
    if (start >= end) { alert('开始时间必须早于结束时间'); e.preventDefault(); return; }
    if (!capacity || capacity <= 0) { alert('名额必须为正整数'); e.preventDefault(); return; }
    if (!deadline) { alert('请填写报名截止时间'); e.preventDefault(); return; }
    if (deadline >= start) { alert('报名截止时间必须早于活动开始时间'); e.preventDefault(); return; }
    if (!confirm('确认发布此活动?')) { e.preventDefault(); }
});
</script>
{% endblock %}
